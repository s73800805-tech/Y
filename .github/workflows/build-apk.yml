name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout & Lingkungan
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Injeksi Build-Tools
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "build-tools;29.0.3"

      - name: Build Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Keystore Digital
        run: |
          keytool -genkey -v -keystore release.keystore -alias mario_key -keyalg RSA -keysize 2048 -validity 10000 -storepass mariopass123 -keypass mariopass123 -dname "CN=SuperMario, OU=MobileDev, O=AppStudio, L=Surabaya, ST=EastJava, C=ID"
          echo "KEYSTORE_BASE64=$(base64 -w 0 release.keystore)" >> $GITHUB_ENV

      - name: Signing APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
          alias: mario_key
          keyStorePassword: mariopass123
          keyPassword: mariopass123

      - name: Artifact Output
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: |
            android/app/build/outputs/apk/release/*signed*.apk
            android/app/build/outputs/apk/release/*.apk
